name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']            # dev toolchain floor (Pest 4 + symfony/console v8); add '8.5' when released
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/pest --coverage --min=85

  compat:
    name: Runtime PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']     # end-user support floor
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Resolve runtime deps at their lowest supported versions
        run: composer update --prefer-lowest --prefer-stable --no-dev --no-interaction --no-progress
      - name: Assert the package parses on this PHP
        run: find src bin -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
      - name: Smoke-test the CLI
        run: |
          php bin/pulsar --version
          php bin/pulsar ping
